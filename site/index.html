<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Junior SWE jobs around Zwolle</title>
<style>
  :root { --bg:#f7f7f5; --card:#fff; --text:#1c1c1a; --muted:#6b6b66; --line:#e2e2dd; --accent:#2457c5; --warn:#a15c00; --warn-bg:#fff3dc; --ok:#1d6b3a; --ok-bg:#e3f4e9; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#17171a; --card:#212125; --text:#ececea; --muted:#9a9a96; --line:#33333a; --accent:#7aa2ff; --warn:#f2b45c; --warn-bg:#3a2d14; --ok:#7bd69b; --ok-bg:#16301f; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font:16px/1.5 system-ui, sans-serif; background:var(--bg); color:var(--text); }
  main { max-width:820px; margin:0 auto; padding:24px 16px 64px; }
  h1 { margin:0 0 4px; font-size:1.6rem; }
  h2 { margin:32px 0 12px; font-size:1.2rem; }
  .sub, .muted { color:var(--muted); }
  .controls { display:flex; flex-wrap:wrap; gap:12px; align-items:center; margin:16px 0; }
  input[type=search] { flex:1 1 220px; padding:8px 10px; font:inherit; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--text); }
  label { font-size:.95rem; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px 16px; margin-bottom:12px; }
  .card h3 { margin:0 0 2px; font-size:1.05rem; }
  .meta { color:var(--muted); font-size:.92rem; }
  .badges { margin:8px 0; display:flex; flex-wrap:wrap; gap:6px; }
  .badge { font-size:.8rem; padding:2px 8px; border-radius:999px; border:1px solid var(--line); }
  .badge.en { background:var(--ok-bg); color:var(--ok); border-color:transparent; }
  .badge.stale { background:var(--warn-bg); color:var(--warn); border-color:transparent; }
  dl { margin:8px 0 0; display:grid; grid-template-columns:auto 1fr; gap:2px 12px; font-size:.95rem; }
  dt { color:var(--muted); }
  dd { margin:0; overflow-wrap:anywhere; }
  a { color:var(--accent); }
  details { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 14px; margin-bottom:10px; }
  summary { cursor:pointer; font-weight:600; }
  .doc h4 { margin:14px 0 4px; }
  .doc ul, .doc ol { margin:4px 0 8px; padding-left:22px; }
  .empty { padding:20px; border:1px dashed var(--line); border-radius:10px; text-align:center; color:var(--muted); }
  code { background:var(--line); padding:1px 5px; border-radius:4px; }
</style>
</head>
<body>
<main>
  <h1>Junior SWE jobs around Zwolle</h1>
  <p class="sub">Within 50 km of Zwolle. Data last built <span id="built">?</span>. This page only shows what was saved by the last sync. Ask questions in Claude Code with <code>kb-answer</code>.</p>

  <h2>Vacancies</h2>
  <div class="controls">
    <input type="search" id="q" placeholder="Search title, company, town…" aria-label="Search vacancies">
    <label><input type="checkbox" id="en"> English option only</label>
    <label><input type="checkbox" id="closed"> Show closed</label>
  </div>
  <div id="vacancies"></div>

  <h2>Interview preparation</h2>
  <div id="prep"></div>

  <h2>Last checked</h2>
  <details><summary>Sync log</summary><div class="doc" id="log"></div></details>
</main>

<script src="data.js"></script>
<script>
(function () {
  var data = window.HARNESS_DATA || { built: "never", vacancies: [], prep: [], syncLog: "" };
  var STALE_DAYS = 7;

  // Everything from context/ is untrusted text: build DOM with textContent, never innerHTML.
  function el(tag, opts, children) {
    var n = document.createElement(tag);
    opts = opts || {};
    if (opts.cls) n.className = opts.cls;
    if (opts.text != null) n.textContent = opts.text;
    (children || []).forEach(function (c) { if (c) n.appendChild(c); });
    return n;
  }
  function safeUrl(u) { return /^https?:\/\//i.test(u || "") ? u : null; }
  function known(v) { return v && v !== "unknown" && v.trim() !== ""; }
  function ageDays(iso) {
    var d = Date.parse(iso);
    return isNaN(d) ? null : Math.floor((Date.now() - d) / 86400000);
  }

  function row(dl, label, value) {
    dl.appendChild(el("dt", { text: label }));
    dl.appendChild(el("dd", { text: value || "unknown" }));
  }

  function card(v) {
    var age = ageDays(v.fetched);
    var badges = el("div", { cls: "badges" }, [
      el("span", { cls: "badge", text: v.level || "level unknown" }),
      el("span", { cls: "badge", text: "lang: " + (v.language || "unknown") }),
      v.english_option === "yes" ? el("span", { cls: "badge en", text: "English option" }) : null,
      v.status === "closed" ? el("span", { cls: "badge stale", text: "closed" }) : null,
      v.status !== "closed" && (age === null || age > STALE_DAYS)
        ? el("span", { cls: "badge stale", text: "may be closed, check the link" }) : null
    ]);

    var dl = el("dl");
    row(dl, "English", v.english_option);
    row(dl, "Contact", v.contact || "no contact found");
    var apply = safeUrl(v.apply_url) || safeUrl(v.source_url);
    dl.appendChild(el("dt", { text: "Apply" }));
    var dd = el("dd");
    if (apply) { var a = el("a", { text: apply }); a.href = apply; a.rel = "noopener noreferrer"; a.target = "_blank"; dd.appendChild(a); }
    else dd.textContent = "no link saved";
    dl.appendChild(dd);
    row(dl, "Fetched", v.fetched);

    var kids = [
      el("h3", { text: v.title || "(untitled)" }),
      el("div", { cls: "meta", text: [v.company, v.location].filter(known).join(" · ") }),
      badges, dl
    ];
    if (v.summary) {
      kids.push(el("details", {}, [el("summary", { text: "Description" }), el("p", { text: v.summary, cls: "muted" })]));
    }
    return el("div", { cls: "card" }, kids);
  }

  function renderVacancies() {
    var q = document.getElementById("q").value.toLowerCase();
    var enOnly = document.getElementById("en").checked;
    var showClosed = document.getElementById("closed").checked;
    var box = document.getElementById("vacancies");
    box.textContent = "";

    if (!data.vacancies.length) {
      box.appendChild(el("div", { cls: "empty", text: "No vacancies saved yet. Run /kb-sync in Claude Code." }));
      return;
    }
    var shown = data.vacancies.filter(function (v) {
      if (v.status === "closed" && !showClosed) return false;
      if (enOnly && v.english_option !== "yes") return false;
      var hay = [v.title, v.company, v.location, v.level].join(" ").toLowerCase();
      return hay.indexOf(q) !== -1;
    });
    if (!shown.length) box.appendChild(el("div", { cls: "empty", text: "Nothing matches these filters." }));
    shown.forEach(function (v) { box.appendChild(card(v)); });
  }

  // Minimal Markdown: #/##/### headings, "- " and "1. " lists, paragraphs. Output is DOM, not HTML.
  function renderMarkdown(text, into) {
    var list = null, listType = null;
    function closeList() { list = null; listType = null; }
    text.split("\n").forEach(function (line) {
      var h = /^(#{1,4})\s+(.*)$/.exec(line);
      var ul = /^\s*[-*]\s+(.*)$/.exec(line);
      var ol = /^\s*\d+\.\s+(.*)$/.exec(line);
      if (h) { closeList(); into.appendChild(el("h4", { text: h[2] })); }
      else if (ul || ol) {
        var type = ul ? "ul" : "ol";
        if (listType !== type) { list = el(type); into.appendChild(list); listType = type; }
        list.appendChild(el("li", { text: (ul || ol)[1] }));
      } else if (line.trim()) { closeList(); into.appendChild(el("p", { text: line })); }
      else closeList();
    });
  }

  document.getElementById("built").textContent = data.built;
  ["q", "en", "closed"].forEach(function (id) {
    document.getElementById(id).addEventListener("input", renderVacancies);
  });
  renderVacancies();

  var prep = document.getElementById("prep");
  if (!data.prep.length) prep.appendChild(el("div", { cls: "empty", text: "No interview notes yet." }));
  data.prep.forEach(function (p, i) {
    var body = el("div", { cls: "doc" });
    renderMarkdown(p.text, body);
    var d = el("details", {}, [el("summary", { text: p.file.split("/").pop() }), body]);
    if (i === 0) d.open = true;
    prep.appendChild(d);
  });

  var log = document.getElementById("log");
  if (data.syncLog) renderMarkdown(data.syncLog, log);
  else log.appendChild(el("p", { cls: "muted", text: "No sync has run yet." }));
})();
</script>
</body>
</html>
